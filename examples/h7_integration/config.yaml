# yaml-language-server: $schema=../../docs/robot.schema.json
# 机器人配置 v2：当前生成 RM 四轮底盘装配、参数及依赖，修改后构建自动更新。
# arm/通信/任务创建仍在 app/board 手写。以下均为演示值，不是 zzrobot 的机械标定。
version: 2
project:
  name: mr_h7_integration
  library: ../..

# profile 是 board 适配包标识；引脚/时钟/DMA/中断仍由 board/Cube 配置。
# 相对路径均相对本 config.yaml 所在目录，而不是运行命令的目录。
board:
  profile: h723_zzrobot
  cube_root: ../../../../board-H7/zzrobot
  bindings:
    can:
      motor_can: BSP_CAN_1
    uart:
      telemetry_uart: BSP_UART_PC

runtime:
  allow_motor_tx: false
  auto_enable: false

# 用逻辑名称引用设备，不在模块中重复填写 CAN ID。
devices:
  motors:
    wheel_fr:
      kind: rm
      model: M3508
      bus: motor_can
      feedback_id: 0x201
      reverse: false
      external_ratio: 1.0
      feedback_timeout_ms: 20
    wheel_fl:
      kind: rm
      model: M3508
      bus: motor_can
      feedback_id: 0x202
      reverse: false
      external_ratio: 1.0
      feedback_timeout_ms: 20
    wheel_rl:
      kind: rm
      model: M3508
      bus: motor_can
      feedback_id: 0x203
      reverse: false
      external_ratio: 1.0
      feedback_timeout_ms: 20
    wheel_rr:
      kind: rm
      model: M3508
      bus: motor_can
      feedback_id: 0x204
      reverse: false
      external_ratio: 1.0
      feedback_timeout_ms: 20

    # DM/LZ 的厂家协议已包含内部减速，external_ratio 只填额外机构传动比。
    # DM 会占用 can_id、can_id+0x100、can_id+0x200 和 master_id，均需避免冲突。
    arm_0:
      kind: dm
      model: J4310
      bus: motor_can
      can_id: 0x11
      master_id: 0x321
      reverse: false
      external_ratio: 1.0
      feedback_timeout_ms: 20
      mit:
        position_range_rad: 12.5
        velocity_range_rad_s: 30.0
        torque_range_nm: 10.0
    arm_1:
      kind: dm
      model: J4310
      bus: motor_can
      can_id: 0x12
      master_id: 0x322
      reverse: false
      external_ratio: 1.0
      feedback_timeout_ms: 20
      mit:
        position_range_rad: 12.5
        velocity_range_rad_s: 30.0
        torque_range_nm: 10.0
    arm_2:
      kind: dm
      model: J4310
      bus: motor_can
      can_id: 0x13
      master_id: 0x323
      reverse: false
      external_ratio: 1.0
      feedback_timeout_ms: 20
      mit:
        position_range_rad: 12.5
        velocity_range_rad_s: 30.0
        torque_range_nm: 10.0

  wheels:
    front_right: {motor: wheel_fr, radius_m: 0.1}
    front_left: {motor: wheel_fl, radius_m: 0.1}
    rear_left: {motor: wheel_rl, radius_m: 0.1}
    rear_right: {motor: wheel_rr, radius_m: 0.1}

  # v2 首版示例仅定义独立旋转关节。耦合/直线关节后续通过明确类型扩展。
  # q_joint = q_motor - zero_offset_rad；额外传动比已在 motor 层处理，不重复乘。
  joints:
    shoulder:
      motor: arm_0
      zero_offset_rad: 0.0
      limits: {min_rad: -1.0, max_rad: 1.0, max_velocity_rad_s: 1.0, max_acceleration_rad_s2: 2.0}
    elbow:
      motor: arm_1
      zero_offset_rad: 0.0
      limits: {min_rad: -1.0, max_rad: 1.0, max_velocity_rad_s: 1.0, max_acceleration_rad_s2: 2.0}
    wrist:
      motor: arm_2
      zero_offset_rad: 0.0
      limits: {min_rad: -1.0, max_rad: 1.0, max_velocity_rad_s: 1.0, max_acceleration_rad_s2: 2.0}

modules:
  chassis:
    type: chassis
    model: mecanum
    # 固定顺序：右前、左前、左后、右后；不能按字典排序。
    wheels: [front_right, front_left, rear_left, rear_right]
    # 明确用“半轮距”，避免当前 C++ wheelbase_m/trackwidth_m 命名的歧义。
    geometry: {half_wheelbase_m: 0.4, half_trackwidth_m: 0.4}
    limits: {vx_mps: 2.0, vy_mps: 2.0, wz_rad_s: 2.0, max_wheel_speed_mps: 3.0}
    feedback_timeout_ms: 20
    wheel_velocity_pid: {k: 1.0, p: 1.0, i: 0.0, d: 0.0, output_limit_nm: 2.0}

  arm:
    type: arm
    model: serial
    # T_parent_child 将子坐标转换到父坐标。旋转 R=Rz(yaw)*Ry(pitch)*Rx(roll)。
    base_to_world: {translation_m: [0.0, 0.0, 0.0], rpy_rad: [0.0, 0.0, 0.0]}
    tool_to_last_joint: {translation_m: [0.0, 0.0, 0.0], rpy_rad: [0.0, 0.0, 0.0]}
    gravity_world_m_s2: [0.0, 0.0, 0.0]
    enable_gravity_compensation: false
    # 顺序就是串联关节顺序，Arm<N> 的 N 从条目数推导，不再重复填写。
    joints:
      - device: shoulder
        axis_in_joint_frame: [0.0, 0.0, 1.0]
        parent_to_joint: {translation_m: [0.1, 0.0, 0.0], rpy_rad: [0.0, 0.0, 0.0]}
        gains: {kp_nm_per_rad: 5.0, kd_nm_s_per_rad: 0.2, effort_scale: 0.0}
      - device: elbow
        axis_in_joint_frame: [0.0, 0.0, 1.0]
        parent_to_joint: {translation_m: [0.1, 0.0, 0.0], rpy_rad: [0.0, 0.0, 0.0]}
        gains: {kp_nm_per_rad: 5.0, kd_nm_s_per_rad: 0.2, effort_scale: 0.0}
      - device: wrist
        axis_in_joint_frame: [0.0, 0.0, 1.0]
        parent_to_joint: {translation_m: [0.1, 0.0, 0.0], rpy_rad: [0.0, 0.0, 0.0]}
        gains: {kp_nm_per_rad: 5.0, kd_nm_s_per_rad: 0.2, effort_scale: 0.0}

communications:
  telemetry:
    protocol: mrlink
    transport: uart
    port: telemetry_uart
    rx_slot_bytes: 96
    rx_slot_count: 4
    publish_period_ms: 100
    # 消息字段及 MessageCodec 在 app 中定义，不在 YAML 写 C/C++。
    codec: app.telemetry

tasks:
  robot:
    period_us: 1000
    stack_bytes: 32768
    priority: normal
    # entry 是将来登记的手写任务入口标识；不是 shell 命令或 YAML 内嵌代码。
    entry: app.robot_cycle
    owns_modules: [chassis, arm]
    services: [telemetry]

# 自定义业务参数统一放命名空间内，避免随意增加公共字段。
# 例：team_name: {control_mode: hold}；公共生成器不会自动解释这里的内容。
extensions: {}
