name: Host tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host and manual integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure host tests
        run: cmake -S . -B build/cmake-host -G Ninja -DMRLIB_BUILD_HOST_TESTS=ON
      - name: Build host tests
        run: cmake --build build/cmake-host --parallel
      - name: Run library regression tests
        run: ctest --test-dir build/cmake-host --output-on-failure
      - name: Configure ordinary consumer project
        run: cmake -S examples/host_project -B build/manual-consumer -G Ninja
      - name: Build ordinary consumer project
        run: cmake --build build/manual-consumer --parallel
      - name: Run ordinary consumer project
        run: ctest --test-dir build/manual-consumer --output-on-failure
      - name: Copy consumer to an independent directory
        run: cmake -E copy_directory examples/host_project "${{ runner.temp }}/mr-consumer"
      - name: Configure independent consumer project
        run: cmake -S "${{ runner.temp }}/mr-consumer" -B "${{ runner.temp }}/mr-consumer-build" -G Ninja -DMR_LIBRARY_ROOT="${{ github.workspace }}"
      - name: Build independent consumer project
        run: cmake --build "${{ runner.temp }}/mr-consumer-build" --parallel
      - name: Run independent consumer project
        run: ctest --test-dir "${{ runner.temp }}/mr-consumer-build" --output-on-failure
