name: Host tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host and project builder tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Configure host tests
        run: cmake -S . -B build/cmake-host -G Ninja -DMR_TESTLIB_BUILD_HOST_TESTS=ON
      - name: Build host tests
        run: cmake --build build/cmake-host --parallel
      - name: Run library regression tests
        run: ctest --test-dir build/cmake-host --output-on-failure
      - name: Run new-project CLI tests
        run: python tools/test_mrctl.py
      - name: Install robot config dependencies
        run: python -m pip install -r tools/requirements-config.txt
      - name: Run robot config and assembly tests
        run: python -m unittest tools.test_robot_config tools.test_robot_generation -v
